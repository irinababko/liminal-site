<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>

    <filter id="bxl" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="75"/>
    </filter>
    <filter id="blg" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>

    <!-- Veil warp: horizontal-biased fractal noise for banding -->
    <filter id="veil" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.020" numOctaves="3" seed="31" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="9"/>
    </filter>

    <!-- Vignette: dark mauve -->
    <radialGradient id="vgn" cx="400" cy="300" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#14101C" stop-opacity="0"/>
      <stop offset="62%"  stop-color="#0C0A12" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#060408" stop-opacity="0.90"/>
    </radialGradient>

  </defs>

  <!-- Base: dark mauve -->
  <rect width="800" height="600" fill="#14101C"/>

  <!-- Coral light — left veil source -->
  <ellipse cx="168" cy="298" rx="272" ry="378" fill="#C07A65" fill-opacity="0.36" filter="url(#bxl)"/>

  <!-- Blue light — right veil source -->
  <ellipse cx="632" cy="298" rx="272" ry="378" fill="#879DB8" fill-opacity="0.38" filter="url(#bxl)"/>

  <!-- Soft mauve centre where veils overlap -->
  <ellipse cx="400" cy="298" rx="172" ry="275" fill="#907090" fill-opacity="0.18" filter="url(#bxl)"/>

  <!-- Layered veil bands — horizontal, organically distorted by turbulence -->
  <g filter="url(#veil)" opacity="0.52">
    <rect x="-50" y="95"  width="900" height="42" fill="#C07A65" fill-opacity="0.16" rx="6"/>
    <rect x="-50" y="192" width="900" height="32" fill="#879DB8" fill-opacity="0.13" rx="6"/>
    <rect x="-50" y="285" width="900" height="48" fill="#C07A65" fill-opacity="0.11" rx="6"/>
    <rect x="-50" y="378" width="900" height="36" fill="#879DB8" fill-opacity="0.15" rx="6"/>
    <rect x="-50" y="462" width="900" height="32" fill="#C07A65" fill-opacity="0.12" rx="6"/>
  </g>

  <!-- Vignette overlay -->
  <rect width="800" height="600" fill="url(#vgn)"/>

</svg>
